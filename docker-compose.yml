# Production stack for one Hetzner box (CX32, 8 GB — see LAUNCH.md).
# `docker compose up -d` after filling .env: with ENVIRONMENT=production the
# app refuses to start on any dev leftover instead of serving it silently
# (app/core/config.py, config_problems).
#
# The database is Neon, so there is no db service here. Both volumes are
# named, not bind mounts: nothing in this stack writes to the repo directory.

services:
  app:
    build: .
    image: superscaler:latest
    restart: always
    env_file: .env
    environment:
      # Explicit, even though these also belong in .env: they are the four
      # settings whose dev default is actively wrong behind a proxy, and a
      # forgotten line here is a silent failure, not a crash.
      ENVIRONMENT: production
      COOKIE_SECURE: "true"
      # Safe ONLY because Caddy overwrites X-Forwarded-For (deploy/Caddyfile).
      TRUST_PROXY_HEADERS: "true"
      # Code default is 4. ONE, because this box is shared with the other
      # projects — see the memory note below. A second job doesn't fail, it
      # waits its turn (a job takes 30-90s, so the queue is short).
      MAX_CONCURRENT_JOBS: "1"
    expose:
      - "8000"
    # What has to fit is MAX_CONCURRENT_JOBS × the worst-case peak of ONE job
    # (~3 GB at max_image_px=3072, measured), not the average. At rest the app
    # uses 100 MB — the 3 GB is a 60-90s spike while a job post-processes.
    #
    # Sized for an 8 GB box shared with the Next.js apps and the other Python
    # projects: ~3.5 GB here leaves ~4 GB for everyone else plus the OS.
    # Going back to 2 concurrent jobs needs either 6g (which this box doesn't
    # have to spare) or the strip-wise rewrite of the post-processor, which
    # drops the peak to a few hundred MB (LAUNCH.md, block 4).
    #
    # The limit is what protects the NEIGHBOURS: over it, only this container
    # dies. Without it the kernel picks the victim, and it usually picks the
    # biggest process — which could be your Next.js app rather than the
    # culprit. Give every other project on this box a mem_limit too.
    #
    # Swap is deliberately left at the default (container may swap up to the
    # limit again): swapping a job is slow, being OOM-killed is downtime.
    mem_limit: 3.5g
    # OpenCV grabs every core it can find, and the CPU stages (denoise, colour
    # match, sharpen) run flat out for tens of seconds. Uncapped, one upscale
    # makes every other site on the box feel slow exactly while someone is
    # using this one. Half the vCPUs: jobs get slightly slower, neighbours
    # stop noticing.
    cpus: 2.0
    volumes:
      # Only used when R2 is unconfigured — but an unconfigured R2 plus no
      # volume means results vanish on redeploy with no error anywhere.
      - storage:/srv/storage
    logging:
      driver: json-file
      # journalctl is the log story (LAUNCH.md); this just stops a stuck
      # error loop from filling the disk the other projects share.
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.10-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env, e.g. superscaler.ai}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env — Let's Encrypt expiry notices}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates live here; losing it re-issues them
      - caddy_config:/config
    depends_on:
      app:
        # Caddy starting first would answer with 502 while migrations run.
        condition: service_healthy

volumes:
  storage:
  caddy_data:
  caddy_config:
