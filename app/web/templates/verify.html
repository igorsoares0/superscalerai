<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SuperScaler — Confirm your email</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11/dist/index.global.js"
          integrity="sha384-XXN6/S6yXj8EpXnBTw3JGR9ZM+hixGxFCLYn0FHtg9cWh0ziKmAgTPEhecbCDOmj"
          crossorigin="anonymous"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-ink:    #0a0a0c;
      --color-panel:  #131316;
      --color-raise:  #1a1a20;
      --color-line:   rgba(255,255,255,0.07);
      --color-body:   #f0f0f3;
      --color-mute:   #8d8d97;
      --color-accent: #4b72ff;
      --color-err:    #ff6161;
      --color-ok:     #3dd68c;
      --font-display: "Space Grotesk", sans-serif;
      --font-sans:    "Inter", system-ui, sans-serif;
      --font-mono:    "JetBrains Mono", ui-monospace, monospace;
    }
  </style>
</head>
<body class="h-full bg-ink font-sans text-body antialiased">
  <main class="flex min-h-full items-center justify-center px-6 py-12">
    <div class="w-full max-w-sm text-center">
      <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-accent/15 font-display text-xl font-bold text-accent">S</div>
      <h1 id="title" class="font-display text-2xl font-bold tracking-tight">Confirming your email…</h1>
      <p id="detail" class="mt-2 text-sm text-mute"></p>
      <p class="mt-8 flex flex-col items-center gap-3">
        <a id="cta" href="/login" class="hidden rounded-xl bg-accent px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-accent/85">Go to sign in</a>
        <button id="resend" class="hidden rounded-xl bg-accent px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-accent/85">Resend the email</button>
        <a id="signout" href="#" class="hidden text-xs text-mute underline underline-offset-2 hover:text-body">Use a different account</a>
      </p>
    </div>
  </main>

  <script>
    /* Two jobs on one page: spend the token from the confirmation email, and
       hold a signed-in-but-unconfirmed account that app.js bounced here
       because uploading and paying both need a confirmed address. Which one
       runs depends on the ?token= being there. */
    const token = new URLSearchParams(location.search).get("token");
    const title = document.getElementById("title");
    const detail = document.getElementById("detail");
    const cta = document.getElementById("cta");
    const resend = document.getElementById("resend");
    const signout = document.getElementById("signout");
    const BONUS = {{ signup_bonus_credits }};

    async function currentUser() {
      try {
        const r = await fetch("/auth/me");
        return r.ok ? await r.json() : null;
      } catch {
        return null;
      }
    }

    function fail(msg) {
      title.textContent = "That link didn't work";
      detail.textContent = msg;
      cta.classList.remove("hidden");
    }

    /* Signed in, nothing confirmed yet: this is the whole app until they
       click the link, so it has to offer the way out (a fresh email) and the
       way around (a different account) rather than just explain. */
    function waitingRoom(me) {
      title.textContent = "Confirm your email";
      detail.textContent =
        `We sent a link to ${me.email}. Click it to open your workspace and ` +
        `collect your ${BONUS} free credits — uploads and plans unlock with it.`;
      resend.classList.remove("hidden");
      signout.classList.remove("hidden");
    }

    resend.addEventListener("click", async () => {
      resend.disabled = true;
      const r = await fetch("/auth/resend-verification", { method: "POST" });
      resend.textContent = r.ok
        ? "Sent — check your inbox"
        : r.status === 429
          ? "Too many requests, try later"
          : "Couldn't send, try again";
      if (!r.ok && r.status !== 429) resend.disabled = false;
    });

    signout.addEventListener("click", async (e) => {
      e.preventDefault();
      await fetch("/auth/logout", { method: "POST" });
      location.href = "/login";
    });

    (async () => {
      if (!token) {
        const me = await currentUser();
        if (me === null) {
          return fail("The link is incomplete. Open it again from the email, or sign in and ask for a new one.");
        }
        if (me.email_verified) {
          location.href = "/"; // already done, nothing to wait for
          return;
        }
        return waitingRoom(me);
      }
      let r;
      try {
        r = await fetch("/auth/verify", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
      } catch {
        return fail("Couldn't reach the server. Check your connection and try again.");
      }
      if (r.ok) {
        // /auth/verify signs you in too, so the workspace is reachable from
        // whichever browser opened the mail
        location.href = "/";
        return;
      }
      const me = await currentUser();
      if (r.status === 400 && me && !me.email_verified) {
        // signed in already: don't send them to a sign-in page they're past —
        // the fix is one click, right here
        title.textContent = "That link didn't work";
        detail.textContent =
          `It's invalid, already used, or expired. We can send ${me.email} a fresh one.`;
        resend.classList.remove("hidden");
        signout.classList.remove("hidden");
        return;
      }
      fail(r.status === 400
        ? "This confirmation link is invalid, already used, or expired. Sign in and we'll send you a fresh one."
        : "Something went wrong. Try the link again in a moment.");
    })();
  </script>
</body>
</html>
